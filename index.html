<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Police Cop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{

}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --desk:#0D0F0D; --paper:#171A17; --bar:#1D241D; --ink:#D9DED2; --faded:#7C867A; --ribbon:#E26A60; --hole:#0D0F0D; --perf:#3A473A;
}}
:root[data-theme="dark"]{
  --desk:#0D0F0D; --paper:#171A17; --bar:#1D241D; --ink:#D9DED2; --faded:#7C867A; --ribbon:#E26A60; --hole:#0D0F0D; --perf:#3A473A;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 1rem)}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--mono);font-size:1rem;-webkit-font-smoothing:antialiased}
.feed{max-width:calc(62ch + 5rem);margin:0 auto;padding:0 .75rem}
.sheet{

.holes.left{border-right:1px dashed var(--perf)}
.holes.right{border-left:1px dashed var(--perf)}

.blk{position:relative;padding:calc(var(--lh)*3) 0 calc(var(--lh)*4);line-height:var(--lh);white-space:pre-wrap;cursor:default}
.blk.poem,.blk.section,.blk.cover{cursor:pointer}
.perf{position:absolute;top:0;left:0;right:0;height:0;border:0;margin:0}
.unfed{height:0;padding:0;overflow:hidden}

.u{color:transparent}
.w{opacity:.45}
.it{font-style:italic}

.banner{white-space:pre;width:fit-content;max-width:100%;margin:0 auto;color:var(--ribbon);line-height:1.15;font-size:min(1.05rem,calc(100cqi / (var(--cols) * .6)))}
.banner .r{min-height:0;padding:0;text-indent:0}

.fit{white-space:pre;font-size:min(1rem,calc(100cqi / (var(--cols) * .6)))}
.fit .r,.toc .r,.center .r{padding:0;text-indent:0}
.center{text-align:center}
.toc{white-space:pre;font-size:min(1rem,calc(100cqi / (var(--cols) * .6)))}
.toc a{color:inherit;text-decoration:none}
.toc a:hover{background:var(--ink);color:var(--paper)}
.toc a:hover .u{color:transparent}
.toc a.sec{font-weight:700;margin-top:var(--lh)}
.toc a.sec:first-child{margin-top:0}
a:focus-visible,button:focus-visible{outline:2px solid var(--ribbon);outline-offset:2px}
.cover{margin:0 auto;width:fit-content;max-width:100%}
.art{white-space:pre;font-size:min(.8rem,calc(100cqi / (var(--cols) * .6)));line-height:1.12;letter-spacing:0}
.art .r{min-height:0;padding:0;text-indent:0}
.loop{position:relative;white-space:pre;font-size:min(1rem,calc(100cqi / (var(--cols) * .6)));line-height:var(--lh);cursor:pointer;min-height:calc(var(--lh)*14)}
.loop .rr{display:block;height:var(--lh)}
.lhead{position:absolute;left:0;top:0;width:1.4ch;height:calc(var(--lh) * .95);border:1px solid var(--ink);opacity:.8;
  background:repeating-linear-gradient(to bottom,var(--ink) 0 1px,transparent 1px 3px);pointer-events:none;display:none}
/* print head */
.rail{position:absolute;left:0;right:0;height:0;border-top:1px solid var(--faded);opacity:0;pointer-events:none;transition:opacity .2s}
.rail.on{opacity:.5}
.phead{position:absolute;left:0;top:0;width:1.4ch;height:calc(var(--lh) * .95);transform:translate(-50%,-50%);pointer-events:none;opacity:0;
  border:1px solid var(--ink);background:repeating-linear-gradient(to bottom,var(--ink) 0 1px,transparent 1px 3px);transition:opacity .2s}
.phead.on{opacity:.8}
.tail{height:calc(45vh + 5rem + env(safe-area-inset-bottom,0px));position:relative}
.empty .tail{height:100vh}
.empty .tail::before{display:none}
.empty .hint{padding-top:35vh}
.hint{display:block;text-align:center;color:var(--faded);padding-top:calc(var(--lh)*2);transition:opacity .3s}
.hint[hidden]{display:block;opacity:0}
.tail::before{content:"";position:absolute;top:0;left:calc(-1 * (var(--pad) + var(--holes)));right:calc(-1 * (var(--pad) + var(--holes)));border-top:1px dashed var(--perf)}
.nav{position:fixed;left:0;right:0;bottom:0;padding:.6rem .75rem calc(.6rem + env(safe-area-inset-bottom,0px));

.nav button{font:inherit;background:none;border:0;color:var(--ink);padding:.35rem .4rem;cursor:pointer;white-space:pre}
.nav button:hover{background:var(--ink);color:var(--desk)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:30rem){ :root{--lh:1.6rem;--holes:1.1rem} body{font-size:.94rem} .feed{padding-inline:.35rem}
  .nav{gap:0;flex-wrap:wrap} .nav button{padding:.4rem .15rem;font-size:.75rem}
  .holes{background-size:100% .4in;background-image:radial-gradient(circle,var(--hole) 0 .22rem,transparent .26rem)} }
</style>
</head>
<body>
<main class="feed">
  <div class="sheet">
    <div class="holes left" aria-hidden="true"></div>

    <div class="holes right" aria-hidden="true"></div>

<nav class="nav" aria-label="Book">
  <button id="toc">[contents]</button>
  <button id="rand">[random]</button>
  <button id="feed">[feed]</button>
  <button id="reset">[reset]</button>
  <button id="snd" aria-pressed="false">[sound off]</button>
</nav>

// ---- sound: a synthesized 9-pin buzz ----
let audio=null;
const snd = {
  on:false,
  init(){
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const buf=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    const src=ctx.createBufferSource(); src.buffer=buf; src.loop=true;
    const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=2600; bp.Q.value=1.2;
    const am=ctx.createGain(); am.gain.value=0;
    const lfo=ctx.createOscillator(); lfo.type='square'; lfo.frequency.value=110;
    const lfoAmt=ctx.createGain(); lfoAmt.gain.value=.5; lfo.connect(lfoAmt).connect(am.gain);
    const out=ctx.createGain(); out.gain.value=0;
    src.connect(bp).connect(am).connect(out).connect(ctx.destination);
    am.gain.setValueAtTime(.5,ctx.currentTime);
    src.start(); lfo.start();
    audio={ctx,out};
  },
  buzz(v){ if(!this.on||!audio) return; audio.out.gain.setTargetAtTime(v?.18:0, audio.ctx.currentTime, .012); },
  thunk(){
    if(!this.on||!audio) return;
    const {ctx}=audio, o=ctx.createOscillator(), g=ctx.createGain();
    o.type='triangle'; o.frequency.setValueAtTime(140,ctx.currentTime); o.frequency.exponentialRampToValueAtTime(60,ctx.currentTime+.06);
    g.gain.setValueAtTime(.12,ctx.currentTime); g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.08);
    o.connect(g).connect(ctx.destination); o.start(); o.stop(ctx.currentTime+.09);
  }
};
const btnSnd=document.getElementById('snd');
btnSnd.onclick=()=>{
  snd.on=!snd.on;
  if(snd.on && !audio) snd.init();
  if(audio) audio.ctx[snd.on?'resume':'suspend']();
  btnSnd.textContent = snd.on ? '[sound on]' : '[sound off]';
  btnSnd.setAttribute('aria-pressed', snd.on);
};

// ---- the printer ----
// The strip only extends as far as the printer has fed it. The head holds a fixed
// line on screen and the page scrolls with it, like paper feeding out of the carriage.
const CH=5, CR=70, LF=45;         // ms per character, carriage return, blank line feed
const CONTINUE=new Set();  // every block waits for a feed
let dir=1, printing=null, skip=false, jobStart=0;
const printLine=()=>innerHeight*0.62;

function blankOut(b){
  b.querySelectorAll('.r[data-s]').forEach(r=>r.innerHTML=`<span class="u">${esc(r.dataset.s)}</span>`);
}
function finish(b){
  b.classList.remove('unfed');
  b.querySelectorAll('.r[data-s]').forEach(r=>r.textContent=r.dataset.s);
  b.dataset.state='done';
}
const frame=()=>new Promise(r=>requestAnimationFrame(r));

function placeHead(x,y){
  const sr=strip.getBoundingClientRect();
  rail.style.top=(y-sr.top)+'px';
  phead.style.left=(x-sr.left)+'px'; phead.style.top=(y-sr.top)+'px';
}
function setHint(){ hint.hidden = !!printing || !nextUnfed() || reduce.matches; document.body.classList.toggle('empty', !printing && !blocks.some(b=>!b.classList.contains('unfed'))); }
function headOn(v){ rail.classList.toggle('on',v); phead.classList.toggle('on',v); snd.buzz(v); }
// keep the head on the print line; report whether the head is on screen
function follow(y){
  const line=printLine();
  if(y>line && y<innerHeight+40) window.scrollBy(0, Math.max(1,(y-line)*0.3));
  return y>-10 && y<innerHeight+10;
}
// run a timed pass, pausing the clock whenever the head is off screen
async function pass(ms, draw){
  let t=0, last=performance.now();
  while(!skip){
    await frame();
    // cap the step so a throttled or hidden tab can't jump ahead
    const now=performance.now(), dt=Math.min(50, now-last); last=now;
    const onScreen = draw(Math.min(1,t/ms));
    if(onScreen){ t+=dt; snd.buzz(true); } else snd.buzz(false);
    if(t>=ms){ draw(1); break; }
  }
}
async function printRow(r, speed){
  const s=r.dataset.s, n=s.length;
  if(!s.trim()){
    r.textContent=s;
    await pass(LF/speed, ()=>follow(r.getBoundingClientRect().bottom));
    return;
  }
  const d=dir; dir=-dir;
  headOn(true);
  await pass(n*CH/speed, p=>{
    const k=Math.round(p*n), wet=k<n?1:0;
    const done = d>0 ? s.slice(0,k) : s.slice(n-k);
    const rest = d>0 ? s.slice(k) : s.slice(0,n-k);
    if(d>0) r.innerHTML=`${esc(done)}<span class="w">${esc(rest.slice(0,wet))}</span><span class="u">${esc(rest.slice(wet))}</span>`;
    else r.innerHTML=`<span class="u">${esc(rest.slice(0,rest.length-wet))}</span><span class="w">${esc(rest.slice(rest.length-wet))}</span>${esc(done)}`;
    const mark=r.querySelector('.w')||r, rects=mark.getClientRects();
    const rc=rects[rects.length-1]||r.getBoundingClientRect();
    const y=rc.top+rc.height/2;
    placeHead(d>0?rc.left:rc.right, y);
    return follow(y);
  });
  r.textContent=s;
  headOn(false); snd.thunk();
  if(!skip) await pass(CR/speed, ()=>follow(r.getBoundingClientRect().bottom));
}
async function printBlock(b){
  printing=b; skip=false; jobStart=performance.now(); setHint();
  blankOut(b); b.classList.remove('unfed'); b.dataset.state='printing';
  const r=b.getBoundingClientRect();
  if(r.top<0 || r.top>innerHeight*0.7) window.scrollBy(0, r.top-innerHeight*0.2);
  const speed=+b.dataset.speed||1;
  for(const row of b.querySelectorAll('.r[data-s]')){ if(skip) break; await printRow(row,+row.dataset.speed||speed); }
  const skipped=skip;
  finish(b); headOn(false); printing=null; skip=false; setHint();
  if(b.querySelector('.loop') && !loop.running) loop.run();
  if(skipped){ const br=b.getBoundingClientRect(); if(br.bottom>innerHeight) window.scrollBy(0, br.bottom-innerHeight*0.8); }
  const i=blocks.indexOf(b);
  if(CONTINUE.has(b.classList[1]) && blocks[i+1] && blocks[i+1].classList.contains('unfed')) return printBlock(blocks[i+1]);
}
const nextUnfed=()=>blocks.find(b=>b.classList.contains('unfed'));

// feed: hurry the current block, or print the next one
function feed(force){
  if(printing){ if(force || performance.now()-jobStart>1200) skip=true; return; }
  const b=nextUnfed(); if(b) printBlock(b);
}
const atBottom=()=>innerHeight+scrollY>=document.documentElement.scrollHeight-4;
let lastFeed=0;
function feedFromScroll(){
  const now=performance.now(); if(now-lastFeed<500) return; lastFeed=now; feed(false);
}
addEventListener('wheel',e=>{ if(e.deltaY>0 && atBottom()) feedFromScroll(); },{passive:true});
let ty=null;
addEventListener('touchstart',e=>{ ty=e.touches[0].clientY; },{passive:true});
addEventListener('touchmove',e=>{ if(ty!==null && ty-e.touches[0].clientY>40 && atBottom()){ ty=null; feedFromScroll(); } },{passive:true});
addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if([' ','PageDown','ArrowDown','End'].includes(e.key) && atBottom()){ e.preventDefault(); feedFromScroll(); }
});
document.getElementById('feed').onclick=()=>feed(true);
tail.addEventListener('click',()=>{ if(!printing) feed(true); });

// click a block to finish it, or to print it again
strip.addEventListener('click',e=>{
  if(e.target.closest('a') || String(getSelection())) return;
  const b=e.target.closest('.blk'); if(!b || b.classList.contains('contents')) return;
  if(printing===b){ skip=true; return; }
  if(!printing && b.dataset.state==='done') printBlock(b);
});

// ---- the runaway print job ----
const loop={
  box:null, rows:null, head:null, lines:[], cur:'', pos:0, running:false, onScreen:true, raf:0, acc:0, last:0,
  RATE:300, // characters per second
  init(){
    this.box=document.querySelector('.loop'); this.rows=[...this.box.querySelectorAll('.rr')]; this.head=this.box.querySelector('.lhead');
    new IntersectionObserver(es=>{ this.onScreen=es[0].isIntersecting; if(!this.onScreen) snd.buzz(false); },{threshold:0}).observe(this.box);
    this.box.addEventListener('click',e=>{ e.stopPropagation(); this.running ? this.brk() : this.run(); });
    addEventListener('keydown',e=>{ if(e.key==='Escape' && this.running) this.brk(); });
  },
  emit(ch){ this.cur+=ch; if(this.cur.length===LOOP_W){ this.lines.push(this.cur); this.cur=''; if(this.lines.length>200) this.lines.splice(0,100); } },
  line(s){ if(this.cur) { this.lines.push(this.cur); this.cur=''; } this.lines.push(s); },
  draw(){
    const shown=this.lines.slice(-(LOOP_H-1)); shown.push(this.cur);
    this.rows.forEach((r,i)=>r.textContent=shown[i]??'');
    const at=shown.length-1, fs=parseFloat(getComputedStyle(this.box).fontSize);
    this.head.style.display=this.running?'block':'none';
    this.head.style.transform=`translate(${this.cur.length*fs*0.6 - fs*0.35}px, ${this.rows[at].offsetTop + 1}px)`;
  },
  tick(now){
    if(!this.running) return;
    const dt=Math.min(100, now-this.last); this.last=now;
    if(this.onScreen){
      this.acc+=dt*this.RATE/1000;
      const n=Math.floor(this.acc); this.acc-=n;
      for(let i=0;i<n;i++){ this.emit(LOOP_STR[this.pos]); this.pos=(this.pos+1)%LOOP_STR.length; }
      if(n) this.draw();
      snd.buzz(true);
    }
    this.raf=requestAnimationFrame(t=>this.tick(t));
  },
  run(){
    if(!this.box) this.init();
    if(this.lines.length||this.cur) this.line('run');
    this.running=true; this.pos=0; this.last=performance.now();
    if(reduce.matches){ this.running=false; for(let i=0;i<LOOP_W*(LOOP_H-1);i++){ this.emit(LOOP_STR[i%LOOP_STR.length]); } this.draw(); return; }
    this.raf=requestAnimationFrame(t=>this.tick(t));
  },
  brk(){
    this.running=false; cancelAnimationFrame(this.raf); snd.buzz(false); snd.thunk();
    this.line(''); this.line('break in 10'); this.line('ready.'); this.draw();
  }
};

// ---- navigation ----
async function jump(id){
  const target=document.getElementById(id); if(!target) return;
  while(printing){ skip=true; await frame(); }
  // anything between the end of the paper and the target prints instantly
  for(const b of blocks){ if(b===target) break; if(b.classList.contains('unfed')) finish(b); }
  target.classList.remove('unfed');
  target.scrollIntoView({block:'start'});
  if(reduce.matches){ finish(target); setHint(); return; }
  printBlock(target);
}
addEventListener('hashchange',()=>jump(decodeURIComponent(location.hash.slice(1))));
document.getElementById('toc').onclick=()=>{ if(location.hash==='#contents') jump('contents'); else location.hash='contents'; };
document.getElementById('rand').onclick=()=>{
  let id; do{ id=poemIds[(Math.random()*poemIds.length)|0]; }while('#'+id===location.hash && poemIds.length>1);
  location.hash=id;
};

// ---- reset: clear the print buffer and start over ----
async function reset(){
  while(printing){ skip=true; await frame(); }
  if(loop.box){ loop.running=false; cancelAnimationFrame(loop.raf); loop.lines=[]; loop.cur=''; loop.draw(); }
  snd.buzz(false); headOn(false);
  history.replaceState(null,'',location.pathname+location.search);
  window.scrollTo(0,0);
  if(reduce.matches){ if(loop.box) loop.run(); return; }
  blocks.forEach(b=>{ blankOut(b); b.classList.add('unfed'); delete b.dataset.state; });
  dir=1; setHint();
}
document.getElementById('reset').onclick=reset;

// ---- start ----
if(reduce.matches){ blocks.forEach(finish); setHint(); loop.run(); if(location.hash) jump(decodeURIComponent(location.hash.slice(1))); }
else {
  blocks.forEach(b=>{ blankOut(b); b.classList.add('unfed'); });
  if(location.hash) jump(decodeURIComponent(location.hash.slice(1)));
  else setHint();
}
</script>
